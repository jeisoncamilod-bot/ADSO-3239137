services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: plans-archive-php
    working_dir: /app
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./:/app
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: host.docker.internal
      DB_PORT: "5434"
      DB_DATABASE: plans_archive
      DB_USERNAME: plans_archive
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped